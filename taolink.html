<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tạo Link</title>
<meta name="description" content="Tạo Link.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08070F;
    --cyan: #3FF3FF;
    --magenta: #FF3FC0;
    --purple: #7B4DFF;
    --gold: #FFC94A;
    --panel: #12102A;
    --panel-2: #1C1840;
    --text: #F1EFFF;
    --text-soft: rgba(241,239,255,0.68);
    --text-softer: rgba(241,239,255,0.45);
    --danger: #FF5C7A;
    --font-display: 'Orbitron', ui-sans-serif, system-ui, sans-serif;
    --font-body: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(900px 600px at 12% -5%, rgba(123,77,255,0.28), transparent 60%),
      radial-gradient(900px 700px at 90% 105%, rgba(63,243,255,0.16), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 18px;
    position: relative;
    overflow-x: hidden;
  }

  .scanlines {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
  }
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(241,239,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(241,239,255,0.045) 1px, transparent 1px);
    background-size: 32px 32px;
    -webkit-mask-image: radial-gradient(circle at 50% 25%, black, transparent 72%);
    mask-image: radial-gradient(circle at 50% 25%, black, transparent 72%);
    pointer-events: none;
  }

  .view { width: 100%; max-width: 460px; position: relative; z-index: 1; }
  .hidden { display: none !important; }

  .booth { text-align: center; }

  .eyebrow {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--cyan);
    border: 1px solid rgba(63,243,255,0.5);
    box-shadow: 0 0 14px rgba(63,243,255,0.25);
    border-radius: 999px;
    padding: 5px 14px;
    margin-bottom: 20px;
  }

  .title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.6rem, 6vw, 2.3rem);
    line-height: 1.25;
    margin: 0 0 12px;
    letter-spacing: 0.01em;
    text-shadow: 0 0 22px rgba(63,243,255,0.35);
  }

  .sub {
    color: var(--text-soft);
    font-size: 0.96rem;
    max-width: 380px;
    margin: 0 auto 28px;
  }

  /* HUD remaining-crates bar */
  .hud-bar { max-width: 280px; margin: 0 auto 26px; }
  .hud-bar-label {
    display: flex; justify-content: space-between;
    font-family: var(--font-mono); font-size: 0.68rem;
    letter-spacing: 0.1em; color: var(--text-soft); margin-bottom: 6px;
  }
  .hud-track {
    height: 8px; border-radius: 999px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .hud-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--magenta), var(--cyan));
    border-radius: 999px;
    transition: width .5s ease;
    box-shadow: 0 0 10px rgba(63,243,255,0.6);
  }

  /* Crate visual */
  .crate { width: 128px; height: 128px; margin: 4px auto 24px; }
  .crate-box {
    width: 100%; height: 100%;
    border-radius: 22px;
    background: linear-gradient(145deg, var(--panel-2), var(--panel));
    border: 2px solid rgba(63,243,255,0.4);
    box-shadow:
      0 0 0 1px rgba(255,62,192,0.15) inset,
      0 0 34px rgba(63,243,255,0.25),
      0 18px 40px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem;
    animation: crateFloat 3s ease-in-out infinite;
  }
  @keyframes crateFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .crate-box.opening { animation: crateShake 0.45s ease-in-out infinite; }
  @keyframes crateShake {
    0%, 100% { transform: translate(0,0) rotate(0deg); }
    25% { transform: translate(-3px,0) rotate(-3deg); }
    75% { transform: translate(3px,0) rotate(3deg); }
  }

  .draw-btn {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #06060d;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    border: none;
    border-radius: 12px;
    padding: 16px 38px;
    box-shadow: 0 0 26px rgba(255,62,192,0.35), 0 10px 26px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, opacity .2s ease;
  }
  .draw-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 34px rgba(255,62,192,0.5), 0 14px 30px rgba(0,0,0,0.45); }
  .draw-btn:active:not(:disabled) { transform: translateY(1px) scale(0.98); }
  .draw-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-text {
    min-height: 1.4em;
    margin-top: 16px;
    font-size: 0.88rem;
    color: var(--text-soft);
  }
  .status-text.error { color: var(--danger); }

  .reward-panel {
    position: relative;
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border: 1px solid rgba(63,243,255,0.35);
    border-radius: 16px;
    padding: 30px 24px 24px;
    text-align: left;
    margin: 10px 0 22px;
    box-shadow: 0 0 44px rgba(123,77,255,0.22), 0 24px 48px rgba(0,0,0,0.5);
  }
  .reward-panel.show { animation: rewardReveal .5s cubic-bezier(.16,1,.3,1) both; }
  @keyframes rewardReveal {
    from { opacity: 0; transform: translateY(16px) scale(.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .reward-eyebrow {
    font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.12em;
    color: var(--gold); text-transform: uppercase;
  }
  .reward-headline {
    font-family: var(--font-display); font-weight: 700; font-size: 1.15rem;
    margin: 8px 0 6px; color: var(--text);
  }
  .reward-note { font-size: 0.85rem; color: var(--text-soft); margin: 0 0 18px; }
  .reward-divider { border: none; border-top: 1px dashed rgba(255,255,255,0.15); margin: 0 0 18px; }

  .link-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .link-row input {
    flex: 1; min-width: 0;
    font-family: var(--font-mono); font-size: 0.83rem;
    padding: 12px 14px; border-radius: 10px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(63,243,255,0.3);
    color: var(--text);
  }
  .link-row button {
    font-family: var(--font-body); font-weight: 700; font-size: 0.83rem;
    border: none; border-radius: 10px; padding: 0 16px;
    background: var(--cyan); color: #062226; cursor: pointer; white-space: nowrap;
  }
  .link-row button:hover { filter: brightness(1.1); }

  .open-link-btn {
    display: block; text-align: center;
    font-family: var(--font-display); font-weight: 700; font-size: 0.9rem;
    letter-spacing: 0.03em; text-decoration: none; text-transform: uppercase;
    color: #fff;
    background: linear-gradient(90deg, var(--magenta), var(--purple));
    border-radius: 10px; padding: 13px;
  }
  .open-link-btn:hover { filter: brightness(1.1); }

  .footnote { font-size: 0.8rem; color: var(--text-softer); margin-top: 6px; }

  /* ---------- Admin ---------- */
  .admin-wrap {
    background: var(--panel);
    border: 1px solid rgba(63,243,255,0.25);
    color: var(--text);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.5);
  }
  .admin-wrap h2 {
    font-family: var(--font-display);
    font-size: 1.05rem;
    letter-spacing: 0.03em;
    margin: 0 0 20px;
    color: var(--cyan);
  }
  .admin-box label {
    display: block; font-size: 0.8rem; font-weight: 600;
    margin-bottom: 6px; color: var(--text-soft);
  }
  .admin-box input, .admin-box textarea {
    width: 100%;
    font-family: var(--font-mono); font-size: 0.86rem;
    padding: 12px 14px; border-radius: 10px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
    margin-bottom: 14px;
    resize: vertical;
  }
  .admin-box button {
    font-family: var(--font-body); font-weight: 700; font-size: 0.88rem;
    border: none; border-radius: 10px; padding: 13px 20px;
    background: var(--cyan); color: #06060d; cursor: pointer; width: 100%;
  }
  .admin-box button:hover { filter: brightness(1.1); }
  .admin-box button:disabled { opacity: .5; cursor: not-allowed; }
  .admin-hint { font-size: 0.76rem; color: var(--text-softer); margin: 10px 0 0; }
  .error-text { color: var(--danger); font-size: 0.85rem; margin: 8px 0 0; }

  .stats-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px;
  }
  .stat {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 12px 6px; text-align: center;
  }
  .stat span { display: block; font-family: var(--font-mono); font-weight: 700; font-size: 1.1rem; color: var(--cyan); }
  .stat label { font-size: 0.62rem; color: var(--text-softer); }

  .danger-btn { background: var(--danger) !important; color: #fff !important; margin-top: 4px; }
  .danger-btn:hover { filter: brightness(1.1); }

  hr.sep { border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 22px 0 18px; }

  .link-list {
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .link-row-admin {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-wrap: wrap;
  }
  .link-row-admin:last-child { border-bottom: none; }
  .link-idx {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-softer);
    min-width: 36px;
  }
  .link-url-input {
    flex: 1 1 160px;
    min-width: 0;
    font-family: var(--font-mono);
    font-size: 0.76rem;
    padding: 7px 9px;
    border-radius: 8px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text);
  }
  .link-status {
    font-size: 0.66rem;
    font-family: var(--font-mono);
    white-space: nowrap;
  }
  .link-status.used { color: var(--gold); }
  .link-status.free { color: var(--cyan); }
  .link-row-actions { display: flex; gap: 6px; }
  .link-row-actions button {
    font-family: var(--font-body);
    font-size: 0.72rem;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    width: auto;
  }
  .save-link-btn { background: var(--cyan); color: #06060d; }
  .delete-link-btn { background: var(--danger); color: #fff; }

  @media (max-width: 420px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="scanlines" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <main id="publicView" class="view">
    <div class="booth">
      <span class="eyebrow">HẰNG NGÀY</span>
      <h1 class="title">Tạo Link Key,<br>FCM.</h1>
      <p class="sub">Lỗi Ib Admin</p>

      <div class="hud-bar">
        <div class="hud-bar-label"><span>LINK CÒN LẠI</span><span id="hudCount">–</span></div>
        <div class="hud-track"><div class="hud-fill" id="hudFill"></div></div>
      </div>

      <div class="crate" id="crateVisual" aria-hidden="true">
        <div class="crate-box" id="crateBox">🎁</div>
      </div>

      <div class="ticket-area">
        <button id="claimBtn" class="draw-btn" type="button">Tạo Link Ngay</button>
        <p id="statusText" class="status-text" role="status" aria-live="polite"></p>
      </div>

      <div id="resultCard" class="reward-panel hidden"></div>

      <p class="footnote">Lượt mới mở lúc <strong>00:00</strong> giờ Việt Nam mỗi ngày.</p>
    </div>
  </main>

  <section id="adminView" class="view hidden">
    <div class="admin-wrap">
      <h2>QUẢN TRỊ · KHO RƯƠNG</h2>

      <div id="loginBox" class="admin-box">
        <label for="adminPass">Mật khẩu quản trị</label>
        <input type="password" id="adminPass" placeholder="••••••••">
        <button id="adminLoginBtn" type="button">Đăng nhập</button>
        <p id="loginError" class="error-text hidden">Sai mật khẩu.</p>
      </div>

      <div id="adminPanel" class="hidden">
        <div class="stats-row">
          <div class="stat"><span id="statTotal">–</span><label>TỔNG RƯƠNG</label></div>
          <div class="stat"><span id="statUsed">–</span><label>ĐÃ MỞ</label></div>
          <div class="stat"><span id="statLeft">–</span><label>CÒN LẠI</label></div>
          <div class="stat"><span id="statToday">–</span><label>HÔM NAY</label></div>
        </div>

        <div class="admin-box">
          <label for="addLinksInput">Thêm link mới (mỗi dòng một link — cộng dồn vào kho hiện có, không xoá link cũ)</label>
          <textarea id="addLinksInput" rows="5" placeholder="https://vidu.com/link-moi-1&#10;https://vidu.com/link-moi-2&#10;..."></textarea>
          <button id="addLinksBtn" type="button">➕ Thêm Vào Kho</button>
        </div>

        <div class="admin-box">
          <label>Danh sách rương hiện có (bấm vào ô link để sửa, rồi bấm Lưu)</label>
          <div id="linkListContainer" class="link-list"><p class="admin-hint">Bấm "Tải lại danh sách" để xem.</p></div>
          <button id="refreshListBtn" type="button">🔄 Tải Lại Danh Sách</button>
        </div>

        <hr class="sep">
        <button id="resetAllBtn" class="danger-btn" type="button">Xoá toàn bộ dữ liệu</button>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  // ====== CẤU HÌNH ======
  const DB_URL = 'https://task-57da3-default-rtdb.firebaseio.com';
  const ADMIN_PASSWORD = 'doimatkhaunay';

  // ====== FIREBASE REST HELPERS ======
  function noCacheUrl(path) {
    return DB_URL + '/' + path + '.json?_=' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
  }

  async function fbGet(path) {
    const res = await fetch(noCacheUrl(path), { cache: 'no-store' });
    if (!res.ok) throw new Error('Không đọc được dữ liệu (' + res.status + ')');
    return res.json();
  }

  async function fbGetWithEtag(path) {
    const res = await fetch(noCacheUrl(path), {
      cache: 'no-store',
      headers: { 'X-Firebase-ETag': 'true' }
    });
    if (!res.ok) throw new Error('Không đọc được dữ liệu (' + res.status + ')');
    const etag = res.headers.get('etag');
    if (!etag) throw new Error('Không lấy được ETag từ máy chủ');
    const data = await res.json();
    return { data: data, etag: etag };
  }

  async function fbPut(path, value) {
    const res = await fetch(DB_URL + '/' + path + '.json', {
      method: 'PUT',
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(value)
    });
    if (!res.ok) throw new Error('Không ghi được dữ liệu (' + res.status + ')');
    return res.json();
  }

  async function fbPutConditional(path, value, etag) {
    const res = await fetch(DB_URL + '/' + path + '.json', {
      method: 'PUT',
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json', 'if-match': etag },
      body: JSON.stringify(value)
    });
    return res.status === 200;
  }

  async function fbDelete(path) {
    const res = await fetch(DB_URL + '/' + path + '.json', { method: 'DELETE', cache: 'no-store' });
    if (!res.ok) throw new Error('Không xoá được dữ liệu (' + res.status + ')');
  }

  async function fbPatch(path, value) {
    const res = await fetch(DB_URL + '/' + path + '.json', {
      method: 'PATCH',
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(value)
    });
    if (!res.ok) throw new Error('Không cập nhật được dữ liệu (' + res.status + ')');
    return res.json();
  }

  // ====== TIỆN ÍCH ======
  function getVNDateKey() {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Ho_Chi_Minh',
      year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
  }

  function sanitizeIpKey(ip) {
    return String(ip).replace(/[.#$\[\]\/]/g, '_');
  }

  function displayIpKey(ipKey) {
    // Chỉ để hiển thị cho admin: đổi dấu "_" (được thay cho dấu "." khi lưu) về lại dạng IP dễ đọc.
    return String(ipKey).replace(/_/g, '.');
  }

  async function getClientIP() {
    try {
      const res = await fetch('https://api.ipify.org?format=json');
      if (res.ok) {
        const data = await res.json();
        if (data && data.ip) return data.ip;
      }
    } catch (e) { /* rơi xuống nguồn dự phòng */ }
    const res2 = await fetch('https://icanhazip.com/');
    if (!res2.ok) throw new Error('Không xác định được địa chỉ IP của bạn');
    const text = (await res2.text()).trim();
    if (!text) throw new Error('Không xác định được địa chỉ IP của bạn');
    return text;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function isHttpUrl(str) {
    return /^https?:\/\/\S+$/i.test(String(str).trim());
  }

  function crateCodeLabel(key, total) {
    const n = parseInt(String(key).replace(/^l/, ''), 10);
    if (isNaN(n)) return '';
    const idx = String(n + 1).padStart(3, '0');
    return total ? ('MÃ LINK #' + idx + ' / ' + String(total).padStart(3, '0')) : ('LINK #' + idx);
  }

  // ====== LOGIC MỞ RƯƠNG (an toàn khi nhiều người bấm cùng lúc, dùng ETag/if-match) ======
  async function claimRandomLink(ipKey, dateKey) {
    const claimPath = 'dailyClaims/' + dateKey + '/' + ipKey;

    for (let attempt = 0; attempt < 4; attempt++) {
      const first = await fbGetWithEtag(claimPath);
      if (first.data !== null) {
        return { alreadyClaimed: true, existing: first.data };
      }
      const claimEtag = first.etag;

      const pool = (await fbGet('linkPool')) || {};
      const total = Object.keys(pool).length;
      let candidates = Object.keys(pool).filter(function (k) { return pool[k] && pool[k].used === false; });
      if (candidates.length === 0) {
        return { outOfLinks: true };
      }

      let assignedUrl = null;
      let assignedKey = null;
      while (candidates.length > 0 && !assignedUrl) {
        const idx = Math.floor(Math.random() * candidates.length);
        const tryKey = candidates[idx];
        const linkPath = 'linkPool/' + tryKey;
        const linkRes = await fbGetWithEtag(linkPath);
        if (linkRes.data && linkRes.data.used === false) {
          const ok = await fbPutConditional(linkPath, { url: linkRes.data.url, used: true, claimedByIp: ipKey, claimedAt: Date.now() }, linkRes.etag);
          if (ok) { assignedUrl = linkRes.data.url; assignedKey = tryKey; break; }
        }
        candidates.splice(idx, 1);
      }

      if (!assignedUrl) {
        continue;
      }

      const claimOk = await fbPutConditional(claimPath, { url: assignedUrl, key: assignedKey, time: Date.now() }, claimEtag);
      if (claimOk) {
        return { url: assignedUrl, key: assignedKey, total: total };
      }

      await fbPut('linkPool/' + assignedKey, { url: assignedUrl, used: false });
    }

    const finalCheck = await fbGet(claimPath);
    if (finalCheck) return { alreadyClaimed: true, existing: finalCheck };
    throw new Error('Hệ thống đang bận, vui lòng thử lại.');
  }

  // ====== GIAO DIỆN CÔNG KHAI ======
  const claimBtn = document.getElementById('claimBtn');
  const statusText = document.getElementById('statusText');
  const resultCard = document.getElementById('resultCard');
  const crateVisual = document.getElementById('crateVisual');
  const crateBox = document.getElementById('crateBox');
  const hudCount = document.getElementById('hudCount');
  const hudFill = document.getElementById('hudFill');

  function setStatus(msg, isError) {
    statusText.textContent = msg || '';
    statusText.classList.toggle('error', !!isError);
  }

  async function refreshHud() {
    try {
      const pool = (await fbGet('linkPool')) || {};
      const keys = Object.keys(pool);
      const total = keys.length;
      const used = keys.filter(function (k) { return pool[k] && pool[k].used; }).length;
      const left = total - used;
      hudCount.textContent = left + ' / ' + total;
      hudFill.style.width = total > 0 ? (Math.max(0, (left / total) * 100) + '%') : '0%';
    } catch (e) {
      hudCount.textContent = '—';
    }
  }

  function renderReward(info) {
    if (info.outOfLinks) {
      claimBtn.classList.add('hidden');
      crateVisual.classList.add('hidden');
      setStatus('💔 Kho rương đã hết. Vui lòng liên hệ người tổ chức.', true);
      return;
    }

    claimBtn.classList.add('hidden');
    crateVisual.classList.add('hidden');
    setStatus('');

    const label = info.key ? crateCodeLabel(info.key, info.total) : '';
    const safeUrl = escapeHtml(info.url);
    const clickable = isHttpUrl(info.url);

    resultCard.innerHTML =
      '<div class="reward-eyebrow">' + (label || (info.already ? 'RƯƠNG HÔM NAY' : 'RƯƠNG MỚI')) + '</div>' +
      '<div class="reward-headline">' + (info.already ? 'Link GetKey Của Bạn Đây' : '🎉 Mở rương thành công!') + '</div>' +
      '<p class="reward-note">' + (info.already ? 'Link Bạn Đã Tạo' : 'Đã lưu lại. Bạn có thể xem lại link này bất cứ lúc nào trong hôm nay.') + '</p>' +
      '<hr class="reward-divider">' +
      '<div class="link-row">' +
        '<input type="text" readonly value="' + safeUrl + '" id="linkValue">' +
        '<button id="copyBtn" type="button">Sao chép</button>' +
      '</div>' +
      (clickable ? '<a href="' + safeUrl + '" target="_blank" rel="noopener" class="open-link-btn">Mở link →</a>' : '');

    resultCard.classList.remove('hidden');
    resultCard.classList.remove('show');
    void resultCard.offsetWidth;
    resultCard.classList.add('show');

    document.getElementById('copyBtn').addEventListener('click', copyLinkValue);
    refreshHud();
  }

  function copyLinkValue() {
    const input = document.getElementById('linkValue');
    const btn = document.getElementById('copyBtn');
    input.focus();
    input.select();
    input.setSelectionRange(0, 99999);

    function done() {
      if (!btn) return;
      const original = btn.textContent;
      btn.textContent = 'Đã chép ✓';
      setTimeout(function () { btn.textContent = original; }, 1500);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(input.value).then(done).catch(function () {
        try { document.execCommand('copy'); done(); } catch (e) {}
      });
    } else {
      try { document.execCommand('copy'); done(); } catch (e) {}
    }
  }

  async function checkExistingClaimOnLoad() {
    refreshHud();
    setStatus('Đang kiểm tra lượt của bạn…');
    try {
      const ip = await getClientIP();
      const ipKey = sanitizeIpKey(ip);
      const dateKey = getVNDateKey();
      const existing = await fbGet('dailyClaims/' + dateKey + '/' + ipKey);
      if (existing && existing.url) {
        renderReward({ url: existing.url, key: existing.key, already: true });
      } else {
        setStatus('');
      }
    } catch (e) {
      console.error(e);
      setStatus('Không thể kết nối. Vui lòng tải lại trang.', true);
    }
  }

  claimBtn.addEventListener('click', async function () {
    claimBtn.disabled = true;
    crateBox.classList.add('opening');
    const originalLabel = claimBtn.textContent;
    claimBtn.textContent = 'Đang mở…';
    setStatus('');
    try {
      const ip = await getClientIP();
      const ipKey = sanitizeIpKey(ip);
      const dateKey = getVNDateKey();
      const result = await claimRandomLink(ipKey, dateKey);
      if (result.alreadyClaimed) {
        renderReward({ url: result.existing.url, key: result.existing.key, already: true });
      } else if (result.outOfLinks) {
        renderReward({ outOfLinks: true });
      } else {
        renderReward(result);
      }
    } catch (e) {
      console.error(e);
      setStatus('Có lỗi xảy ra, vui lòng thử lại: ' + e.message, true);
      claimBtn.disabled = false;
      claimBtn.textContent = originalLabel;
    } finally {
      crateBox.classList.remove('opening');
    }
  });

  // ====== GIAO DIỆN QUẢN TRỊ (?admin=1) ======
  const isAdmin = new URLSearchParams(window.location.search).get('admin') === '1';
  const publicView = document.getElementById('publicView');
  const adminView = document.getElementById('adminView');

  if (isAdmin) {
    publicView.classList.add('hidden');
    adminView.classList.remove('hidden');
    bindAdmin();
  } else {
    adminView.classList.add('hidden');
    checkExistingClaimOnLoad();
  }

  function linkIndexOf(key) {
    const n = parseInt(String(key).replace(/^l/, ''), 10);
    return isNaN(n) ? -1 : n;
  }

  function linkRowHtml(key, data) {
    const idx = linkIndexOf(key);
    const idxLabel = idx >= 0 ? String(idx + 1).padStart(3, '0') : '?';
    const statusHtml = data.used
      ? '<span class="link-status used">Đã phát' + (data.claimedByIp ? ' · IP ' + escapeHtml(displayIpKey(data.claimedByIp)) : '') + '</span>'
      : '<span class="link-status free">Còn trống</span>';
    return (
      '<div class="link-row-admin" data-key="' + escapeHtml(key) + '">' +
        '<span class="link-idx">#' + idxLabel + '</span>' +
        '<input type="text" class="link-url-input" value="' + escapeHtml(data.url || '') + '">' +
        statusHtml +
        '<div class="link-row-actions">' +
          '<button class="save-link-btn" type="button">Lưu</button>' +
          '<button class="delete-link-btn" type="button">Xoá</button>' +
        '</div>' +
      '</div>'
    );
  }

  async function loadLinkList() {
    const container = document.getElementById('linkListContainer');
    container.innerHTML = '<p class="admin-hint">Đang tải…</p>';
    try {
      const pool = (await fbGet('linkPool')) || {};
      const keys = Object.keys(pool).sort(function (a, b) { return linkIndexOf(a) - linkIndexOf(b); });
      if (keys.length === 0) {
        container.innerHTML = '<p class="admin-hint">Chưa có rương nào. Thêm link ở ô phía trên để bắt đầu.</p>';
        return;
      }
      container.innerHTML = keys.map(function (k) { return linkRowHtml(k, pool[k] || {}); }).join('');
    } catch (e) {
      container.innerHTML = '<p class="error-text">Không tải được danh sách: ' + escapeHtml(e.message) + '</p>';
    }
  }

  function bindAdmin() {
    const loginBox = document.getElementById('loginBox');
    const adminPanel = document.getElementById('adminPanel');
    const adminPassInput = document.getElementById('adminPass');
    const loginError = document.getElementById('loginError');

    document.getElementById('adminLoginBtn').addEventListener('click', function () {
      if (adminPassInput.value === ADMIN_PASSWORD) {
        loginBox.classList.add('hidden');
        adminPanel.classList.remove('hidden');
        refreshStats();
        loadLinkList();
        setInterval(refreshStats, 5000);
      } else {
        loginError.classList.remove('hidden');
      }
    });
    adminPassInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('adminLoginBtn').click();
    });

    document.getElementById('addLinksBtn').addEventListener('click', async function () {
      const raw = document.getElementById('addLinksInput').value;
      const lines = raw.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      if (lines.length === 0) { alert('Vui lòng nhập ít nhất một link.'); return; }

      const btn = document.getElementById('addLinksBtn');
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'Đang thêm…';
      try {
        const pool = (await fbGet('linkPool')) || {};
        let maxIdx = -1;
        Object.keys(pool).forEach(function (k) {
          const n = linkIndexOf(k);
          if (n > maxIdx) maxIdx = n;
        });
        const updates = {};
        lines.forEach(function (url, i) { updates['l' + (maxIdx + 1 + i)] = { url: url, used: false }; });
        await fbPatch('linkPool', updates);
        document.getElementById('addLinksInput').value = '';
        alert('Đã thêm ' + lines.length + ' rương mới vào kho.');
        refreshStats();
        loadLinkList();
      } catch (e) {
        alert('Lỗi: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    });

    document.getElementById('refreshListBtn').addEventListener('click', loadLinkList);

    document.getElementById('linkListContainer').addEventListener('click', async function (e) {
      const row = e.target.closest('.link-row-admin');
      if (!row) return;
      const key = row.getAttribute('data-key');

      if (e.target.classList.contains('save-link-btn')) {
        const input = row.querySelector('.link-url-input');
        const newUrl = input.value.trim();
        if (!newUrl) { alert('Link không được để trống.'); return; }
        e.target.disabled = true;
        const original = e.target.textContent;
        e.target.textContent = 'Đang lưu…';
        try {
          const current = (await fbGet('linkPool/' + key)) || {};
          await fbPut('linkPool/' + key, Object.assign({}, current, { url: newUrl }));
          e.target.textContent = 'Đã lưu ✓';
          setTimeout(function () { e.target.textContent = original; e.target.disabled = false; }, 1200);
        } catch (err) {
          alert('Lỗi: ' + err.message);
          e.target.disabled = false;
          e.target.textContent = original;
        }
      } else if (e.target.classList.contains('delete-link-btn')) {
        if (!confirm('Xoá rương #' + (linkIndexOf(key) + 1) + ' khỏi kho? Không thể hoàn tác.')) return;
        e.target.disabled = true;
        try {
          await fbDelete('linkPool/' + key);
          row.remove();
          refreshStats();
        } catch (err) {
          alert('Lỗi: ' + err.message);
          e.target.disabled = false;
        }
      }
    });

    document.getElementById('resetAllBtn').addEventListener('click', async function () {
      if (!confirm('Xoá TOÀN BỘ rương và lượt nhận? Không thể hoàn tác.')) return;
      try {
        await fbDelete('linkPool');
        await fbDelete('dailyClaims');
        alert('Đã xoá toàn bộ dữ liệu.');
        refreshStats();
        loadLinkList();
      } catch (e) {
        alert('Lỗi: ' + e.message);
      }
    });
  }

  async function refreshStats() {
    try {
      const pool = (await fbGet('linkPool')) || {};
      const keys = Object.keys(pool);
      const total = keys.length;
      const used = keys.filter(function (k) { return pool[k] && pool[k].used; }).length;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statUsed').textContent = used;
      document.getElementById('statLeft').textContent = total - used;

      const today = (await fbGet('dailyClaims/' + getVNDateKey())) || {};
      document.getElementById('statToday').textContent = Object.keys(today).length;
    } catch (e) {
      console.error(e);
    }
  }
})();
</script>
</body>
</html>
